[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vjepa2-1-mlx-port"
version = "0.1.0"
description = "Local V-JEPA 2.1 MLX port and parity tooling"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "mlx>=0.29.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "safetensors>=0.5.0",
    "einops>=0.8.0",
    "timm>=1.0.15",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
notebook = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]
viz = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
vjepa2-1 = "vjepa2_1_mlx.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vjepa2_1_mlx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
